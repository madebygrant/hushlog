name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch | minor | major) — leave blank to use package.json version as-is"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Bump version and sync docs
        if: ${{ inputs.version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version }} --no-git-tag-version
          node scripts/sync-docs-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json docs/index.html
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --follow-tags

      - name: Verify docs version matches package.json
        run: node scripts/sync-docs-version.mjs --check

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
